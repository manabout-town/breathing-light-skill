<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Breathing Light Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
/* 스타일: 미니멀리즘 — 밝은 웜 지면 + 클레이 포인트 하나 */
:root{--bg:#f3f1ec;--ink:rgba(27,31,26,.92);--ink-2:rgba(27,31,26,.62);--acc:#b5573b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.7 'Noto Sans KR',sans-serif;letter-spacing:-.01em;word-break:keep-all}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:96px clamp(20px,6vw,96px)}
.hero small{font:400 11px 'Inter Tight',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.hero h1{margin:12px 0 0;font:200 clamp(72px,16vw,220px)/.9 'Inter Tight',sans-serif;letter-spacing:-.04em;
  opacity:0;transform:translateY(24px);transition:opacity 1.2s cubic-bezier(.16,1,.3,1) .2s,transform 1.2s cubic-bezier(.16,1,.3,1) .2s}
.hero h1 b{font-weight:inherit;color:var(--acc)}
.hero p{max-width:26ch;font-size:clamp(17px,2vw,22px);color:var(--ink-2)}
html.bl-open .hero h1{opacity:1;transform:none}
html.dark{--bg:#15120f;--ink:rgba(243,238,230,.94);--ink-2:rgba(243,238,230,.62);--acc:#e08a66;--bl-hero-fallback:linear-gradient(115deg,#1d1814,#2a221b)}
section.next{min-height:60vh;padding:80px clamp(20px,6vw,96px);border-top:1px solid rgba(27,31,26,.1)}
</style>
<link rel="stylesheet" href="breathing-light.css">
</head>
<body>
<div id="bl-intro" role="presentation">
  <div class="bl-orb"><svg viewBox="0 0 100 100"><circle class="bl-track" cx="50" cy="50" r="49"/><circle class="bl-arc" cx="50" cy="50" r="49" pathLength="308"/></svg><i></i><b></b><b></b></div>
  <div class="bl-say"><span>들이마시고</span><span>내쉬고</span></div>
  <div class="bl-cue">Scroll or tap to skip</div>
</div>

<section class="hero bl-hero">
  <canvas id="bl-bg" aria-hidden="true"></canvas>
  <small>Pilates Studio · Seoul</small>
  <h1>Align<b>.</b></h1>
  <p>몸의 선을 바로 세우는 시간.</p>
</section>
<section class="next"><h2>다음 섹션</h2><p>히어로가 화면 밖으로 나가면 배경 렌더가 멈춥니다.</p></section>

<script src="window-light.js"></script>
<script src="breathing-intro.js"></script>
<script>
  // ?preset=warm|linen|dusk|mint · ?shape=circle|key|square 로 바꿔 보기
  var preset = new URLSearchParams(location.search).get('preset') || 'warm';
  if (preset === 'dusk') document.documentElement.classList.add('dark'); // 어두운 프리셋은 흰 글씨·어두운 지면
  WindowLight.mount(document.getElementById('bl-bg'), { preset: preset });
  BreathingIntro.start({ duration: 3000, shape: new URLSearchParams(location.search).get('shape') || 'circle' });
</script>
</body>
</html>
